; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = sanding_kecil

[env:sanding_kecil]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_src_flags = -Wall -Wextra
build_flags = -Iinclude
monitor_echo = yes
monitor_eol = LF
monitor_filters = default, send_on_enter
extra_scripts = pre:tools/version.py
board_build.partitions = default.csv
lib_ldf_mode = deep+
lib_deps = 
	knolleary/PubSubClient@^2.8
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	jandrassy/EthernetENC@^2.0.5
	bblanchon/ArduinoJson@^7.2.2

[env:sanding_kecil_otadry]
extends = env:sanding_kecil
build_flags =
    ${env:sanding_kecil.build_flags}
    -DOTA_DRY_RUN_ON_BOOT=1

[env:sanding_kecil_wdtuji]
extends = env:sanding_kecil
build_flags = ${env:sanding_kecil.build_flags} -DWDT_UJI_MACET=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Iinclude
lib_deps = bblanchon/ArduinoJson@^7.2.2
lib_ldf_mode = deep+
