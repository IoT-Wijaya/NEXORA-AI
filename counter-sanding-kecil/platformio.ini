; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = sanding_kecil

; ---------- Bagian yang sama untuk semua mesin ----------
[common]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = default, send_on_enter
build_src_flags = -Wall -Wextra
extra_scripts = pre:tools/version.py
board_build.partitions = default.csv
lib_ldf_mode = deep+
lib_deps_common =
	knolleary/PubSubClient@^2.8
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	bblanchon/ArduinoJson@^7.2.2

; ---------- Sanding Kecil: ENC28J60 ----------
[env:sanding_kecil]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_echo = ${common.monitor_echo}
monitor_eol = ${common.monitor_eol}
monitor_filters = ${common.monitor_filters}
build_src_flags = ${common.build_src_flags}
extra_scripts = ${common.extra_scripts}
board_build.partitions = ${common.board_build.partitions}
lib_ldf_mode = ${common.lib_ldf_mode}
build_flags = -Iinclude -DMESIN_SANDING_KECIL
lib_deps =
	${common.lib_deps_common}
	jandrassy/EthernetENC@^2.0.5

; ---------- Sanding Besar: W5500 (belum dibangun, menunggu langkah 2) ----------
[env:sanding_besar]
extends = env:sanding_kecil
build_flags = -Iinclude -DMESIN_SANDING_BESAR
lib_deps =
	${common.lib_deps_common}
	arduino-libraries/Ethernet@^2.0.2

; ---------- Env uji (tidak berubah) ----------
[env:sanding_kecil_otadry]
extends = env:sanding_kecil
build_flags =
    ${env:sanding_kecil.build_flags}
    -DOTA_DRY_RUN_ON_BOOT=1

[env:sanding_kecil_wdtuji]
extends = env:sanding_kecil
build_flags = ${env:sanding_kecil.build_flags} -DWDT_UJI_MACET=1

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Iinclude -DMESIN_SANDING_KECIL
lib_deps = bblanchon/ArduinoJson@^7.2.2
lib_ldf_mode = deep+