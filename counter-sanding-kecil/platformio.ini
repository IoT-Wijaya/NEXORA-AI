; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for t~~he other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = sanding_kecil

[env:sanding_kecil]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_src_flags = -Wall -Wextra 
build_flags = -Iinclude
monitor_echo = yes
monitor_eol = LF
monitor_filters = default, send_on_enter
extra_scripts = pre:tools/version.py
lib_deps = 
	knolleary/PubSubClient@^2.8
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	jandrassy/EthernetENC@^2.0.5

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Iinclude
