name: Build ESP32 Firmware Multi-Device

on:
  push:
    branches: [ main ]
    paths:
      - 'counter-sanding-besar/**'
      - 'counter-sanding-kecil/**'
      - 'input-display/**'
  pull_request:
    branches: [ main ]

jobs:
  build-firmware:
    name: Build (${{ matrix.device }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Daftar folder perangkat ESP32 Anda di GitHub
        device: [counter-sanding-besar, counter-sanding-kecil, input-display]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache PlatformIO Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles(format('{0}/platformio.ini', matrix.device)) }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run Build PlatformIO
        working-directory: ./${{ matrix.device }}
        run: pio run

      - name: Upload Artifact Binary
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.device }}
          path: |
            ${{ matrix.device }}/.pio/build/*/firmware.bin
            ${{ matrix.device }}/.pio/build/*/bootloader.bin
            ${{ matrix.device }}/.pio/build/*/partitions.bin
