name: Build ESP32 Firmware Multi-Device

on:
  push:
    branches: [main]
    paths:
      - "counter-sanding-besar/**"
      - "counter-sanding-kecil/**"
      - "input-display/**"
  pull_request:
    branches: [main]
    paths:
      - "counter-sanding-besar/**"
      - "counter-sanding-kecil/**"
      - "input-display/**"

jobs:
  build-firmware:
    name: Build (${{ matrix.device }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        device: [counter-sanding-besar, counter-sanding-kecil, input-display]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache PlatformIO Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles(format('{0}/platformio.ini', matrix.device)) }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run Build PlatformIO
        working-directory: ./${{ matrix.device }}
        run: pio run

      - name: Upload Artifact Binary
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.device }}
          retention-days: 7 # artifact CI cukup disimpan seminggu
          path: |
            ${{ matrix.device }}/.pio/build/*/firmware.bin
            ${{ matrix.device }}/.pio/build/*/bootloader.bin
            ${{ matrix.device }}/.pio/build/*/partitions.bin
