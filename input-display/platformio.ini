; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = input-display

[env:input-display]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_src_flags = -Wall -Wextra
build_flags = -Iinclude
monitor_echo = yes
monitor_eol = LF
monitor_filters = default, send_on_enter
lib_deps = 
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	arduino-libraries/Ethernet@^2.0.2
	bblanchon/ArduinoJson@^7.2.2
	knolleary/PubSubClient@^2.8
	arduino-libraries/NTPClient@^3.2.1
	openslab-osu/SSLClient@^1.6.11
	madhephaestus/ESP32Encoder@^5.0.0

[env:native]
platform = native
test_framework = unity
build_flags = -Iinclude -std=gnu++17 -Wall -Wextra
lib_deps = bblanchon/ArduinoJson@^7.2.2
